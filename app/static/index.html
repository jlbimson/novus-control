<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Novus N20K48 Control</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <div class="brand">
        <span class="brand-mark">N</span>
        <span class="brand-text">N20K48</span>
      </div>
      <div id="conn-status" class="status status-unknown">
        <span class="dot"></span>
        <span class="label">connecting…</span>
      </div>
      <div class="nav-links">
        <a href="/" class="nav-link active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
          <span>Overview</span>
        </a>
        <a href="/static/presets.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
          <span>Presets</span>
        </a>
        <a href="/static/settings.html" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </a>
      </div>
    </nav>

    <main>
      <h1>Overview</h1>

      <div id="device-state" class="state-badges"></div>

      <div id="overview-cards" class="card-grid overview-cards"></div>

      <section id="overview-chart-section">
        <div class="chart-header">
          <div id="chart-legend" class="chart-legend"></div>
          <div class="range-buttons">
            <button data-minutes="60" class="active">1h</button>
            <button data-minutes="360">6h</button>
            <button data-minutes="1440">24h</button>
            <button data-minutes="10080">7d</button>
          </div>
        </div>
        <canvas id="overview-chart" width="900" height="320"></canvas>
      </section>
    </main>
  </div>

  <script src="/static/common.js"></script>
  <script src="/static/overview.js"></script>
</body>
</html>
