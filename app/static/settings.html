<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Novus N20K48 - Settings</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <div class="brand">Novus N20K48</div>
      <div id="conn-status" class="status status-unknown">
        <span class="dot"></span>
        <span class="label">connecting…</span>
      </div>
      <div class="nav-links">
        <a href="/" class="nav-link">Overview</a>
        <a href="/static/presets.html" class="nav-link">Presets</a>
        <a href="/static/settings.html" class="nav-link active">Settings</a>
      </div>
    </nav>

    <main>
      <h1>Settings</h1>

      <section id="readings">
        <h2>Status</h2>
        <div id="reading-cards" class="card-grid"></div>
      </section>

      <section id="chart-section" hidden>
        <h2><span id="chart-title"></span></h2>
        <div class="range-buttons">
          <button data-minutes="60">1h</button>
          <button data-minutes="360">6h</button>
          <button data-minutes="1440">24h</button>
          <button data-minutes="10080">7d</button>
        </div>
        <canvas id="chart" width="800" height="240"></canvas>
      </section>

      <section id="controls">
        <h2>Controls</h2>
        <div id="control-list" class="control-list"></div>
      </section>
    </main>
  </div>

  <script src="/static/common.js"></script>
  <script src="/static/settings.js"></script>
</body>
</html>
